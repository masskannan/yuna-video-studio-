name: Pro Studio 30s Micro-Chunk Pipeline

on:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', '*.json', 'narration.txt']
  workflow_dispatch:
    inputs:
      only_chunk:
        description: 'Optional single chunk ID to re-render (e.g. 000)'
        required: false
        default: ''

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      use_manim: ${{ steps.flags.outputs.use_manim }}
      use_blender: ${{ steps.flags.outputs.use_blender }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          ONLY_CHUNK: ${{ github.event.inputs.only_chunk || '' }}
        run: python3 scripts/plan_chunks.py

      - id: flags
        name: Plan Pro Flags
        run: python3 scripts/plan_flags.py
  voice-lane:
    outputs:
      matrix: ${{ steps.vplan.outputs.matrix }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Voice Lines
        uses: actions/cache@v4
        with:
          path: chunks/voice-cache
          key: voice-cache-${{ hashFiles('dialogue.json', 'narration.txt', 'glossary.json') }}
          restore-keys: voice-cache-
      - id: vplan
        name: Generate Signature Voice (-14 LUFS) + SRT
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg python3-pip
          pip3 install --quiet --break-system-packages edge-tts
          mkdir -p out_audio
          python3 scripts/generate_voice.py
          python3 scripts/plan_finalize.py
          ONLY_CHUNK="${{ github.event.inputs.only_chunk }}" python3 scripts/plan_chunks.py
      - uses: actions/upload-artifact@v4
        with:
          name: master-audio
          path: chunks/master-audio/*
          retention-days: 1

  manim-lane:
    needs: plan
    if: needs.plan.outputs.use_manim == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: manim-pip-v1
      - name: Render Manim
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev ffmpeg && pip install manim && mkdir -p out_pro && manim -ql scenes/manim_scene.py ProScene -o manim_clip.mp4 && cp media/videos/manim_scene/*/manim_clip.mp4 out_pro/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: pro-manim-clip
          path: out_pro/*
  blender-lane:
    needs: plan
    if: needs.plan.outputs.use_blender == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render Blender EEVEE
        run: sudo apt-get update && sudo apt-get install -y blender xvfb && mkdir -p out_pro && xvfb-run -a blender --background --python scenes/blender_scene.py || true
      - uses: actions/upload-artifact@v4
        with:
          name: pro-blender-clip
          path: out_pro/*
  render-chunks:
    needs: [plan, voice-lane, manim-lane, blender-lane]
    if: ${{ !cancelled() && (needs.manim-lane.result == 'success' || needs.manim-lane.result == 'skipped') && (needs.blender-lane.result == 'success' || needs.blender-lane.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJson(needs.voice-lane.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: master-audio
          path: chunks/master-audio
      - run: cp chunks/master-audio/words.json src/words.json && ([ -f chunks/master-audio/manifest.json ] && cp chunks/master-audio/manifest.json src/manifest.json || true) && ([ -f chunks/master-audio/lipsync.json ] && cp chunks/master-audio/lipsync.json src/lipsync.json || true)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/remotion
          key: remotion-v2-${{ hashFiles('package.json') }}
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-lohit-taml
          [ -d node_modules ] || npm install --legacy-peer-deps --no-audit --no-fund
          npx remotion browser ensure
      - name: Render 30s Chunk ${{ matrix.id }} (3x Self-Heal)
        run: |
          mkdir -p out
          OUT="out/chunk_${{ matrix.id }}.mp4"
          for attempt in 1 2 3; do
            if npx remotion render src/index.ts MainMovie "$OUT" --frames=${{ matrix.range }} --muted --concurrency=2; then
              DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$OUT" || echo "0")
              if [ -n "$DUR" ] && awk "BEGIN {exit !($DUR > 0.5)}"; then exit 0; fi
            fi
            rm -f "$OUT"; sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.id }}
          path: out/chunk_*.mp4
          retention-days: 1

  render-reel:
    needs: [plan, voice-lane, manim-lane, blender-lane]
    if: ${{ !cancelled() && (needs.manim-lane.result == 'success' || needs.manim-lane.result == 'skipped') && (needs.blender-lane.result == 'success' || needs.blender-lane.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: master-audio
          path: chunks/master-audio
      - run: cp chunks/master-audio/words.json src/words.json && ([ -f chunks/master-audio/manifest.json ] && cp chunks/master-audio/manifest.json src/manifest.json || true) && ([ -f chunks/master-audio/lipsync.json ] && cp chunks/master-audio/lipsync.json src/lipsync.json || true)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/remotion
          key: remotion-v2-${{ hashFiles('package.json') }}
      - run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-lohit-taml
          [ -d node_modules ] || npm install --legacy-peer-deps --no-audit --no-fund
          npx remotion browser ensure
          mkdir -p out
          npx remotion render src/index.ts Reel9x16 out/reel_9x16.mp4 --muted --concurrency=2
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-reel
          path: out/reel_9x16.mp4
          retention-days: 1

  merge-final:
    needs: [plan, voice-lane, render-chunks, render-reel]
    if: ${{ !cancelled() && needs.voice-lane.result == 'success' && needs.render-chunks.result == 'success' && needs.render-reel.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: chunks
      - name: Quality Gate, Mux Audio & Build 480p Proxy
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          mkdir -p final
          python3 scripts/verify_merge.py
          ffmpeg -y -i chunks/chunk-reel/reel_9x16.mp4 -i chunks/master-audio/master_audio.mp3 -af apad -c:v copy -c:a aac -b:a 192k -shortest final/reel_9x16.mp4
          cp chunks/master-audio/captions.srt final/captions.srt || true
      - name: Send 480p Proxy to Telegram (if configured)
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$BOT" ] && [ -n "$CHAT" ] && curl -s -F "chat_id=$CHAT" -F "video=@final/preview_480p.mp4" -F "caption=YUNA 480p Proxy Ready — Play & Approve" "https://api.telegram.org/bot${BOT}/sendVideo" > /dev/null || true
      - name: Generate A/B Thumbnails
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-lohit-taml python3-pil libraqm0
          python3 scripts/generate_thumbnails.py
      - uses: actions/upload-artifact@v4
        with:
          name: pro-studio-delivery-pack
          path: final/*
          retention-days: 2
