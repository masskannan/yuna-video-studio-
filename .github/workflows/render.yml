name: Pro Studio 30s Micro-Chunk Pipeline

on:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', '*.json', 'narration.txt']
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional topic/prompt for director.py'
        required: false
        default: ''
      only_chunk:
        description: 'Optional single chunk ID to re-render (e.g. 000)'
        required: false
        default: ''

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      use_manim: ${{ steps.flags.outputs.use_manim }}
      use_blender: ${{ steps.flags.outputs.use_blender }}
      render_target: ${{ steps.flags.outputs.render_target }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          ONLY_CHUNK: ${{ github.event.inputs.only_chunk || '' }}
        run: python3 scripts/plan_chunks.py

      - id: flags
        name: Plan Pro Flags
        run: python3 scripts/plan_flags.py
      - name: Cost Firewall & Baseline Lock
        run: python3 -m pip install -q pyyaml && python3 scripts/cost_firewall.py && PYTHONPATH=scripts python3 scripts/test_level11.py
  voice-lane:
    outputs:
      matrix: ${{ steps.vplan.outputs.matrix }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Voice Lines
        uses: actions/cache@v4
        with:
          path: chunks/voice-cache
          key: voice-cache-${{ hashFiles('dialogue.json', 'narration.txt', 'glossary.json') }}
          restore-keys: voice-cache-
      - id: vplan
        name: Generate Signature Voice (-14 LUFS) + SRT
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          (sudo apt-get update -qq || true) && sudo apt-get install -y --no-install-recommends ffmpeg python3-pip
          pip3 install --quiet --break-system-packages edge-tts
          mkdir -p out_audio
          python3 scripts/generate_voice.py
          python3 scripts/plan_finalize.py
          ONLY_CHUNK="${{ github.event.inputs.only_chunk }}" python3 scripts/plan_chunks.py
      - uses: actions/upload-artifact@v4
        with:
          name: master-audio
          path: chunks/master-audio/*
          retention-days: 1

  manim-lane:
    needs: plan
    if: needs.plan.outputs.use_manim == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: manim-pip-v1
      - name: Render Manim
        run: (sudo apt-get update -qq || true) && sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev ffmpeg && pip install manim && mkdir -p out_pro && manim -ql scenes/manim_scene.py ProScene -o manim_clip.mp4 && cp media/videos/manim_scene/*/manim_clip.mp4 out_pro/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: pro-manim-clip
          path: out_pro/*
  blender-lane:
    needs: plan
    if: needs.plan.outputs.use_blender == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render Blender EEVEE
        run: (sudo apt-get update -qq || true) && sudo apt-get install -y --no-install-recommends blender xvfb && mkdir -p out_pro && xvfb-run -a blender --background --python scenes/blender_scene.py || true
      - uses: actions/upload-artifact@v4
        with:
          name: pro-blender-clip
          path: out_pro/*
  render-chunks:
    needs: [plan, voice-lane, manim-lane, blender-lane]
    if: ${{ !cancelled() && needs.plan.outputs.render_target != 'reel' && (needs.manim-lane.result == 'success' || needs.manim-lane.result == 'skipped') && (needs.blender-lane.result == 'success' || needs.blender-lane.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJson(needs.voice-lane.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: master-audio
          path: chunks/master-audio
      - run: cp chunks/master-audio/words.json src/words.json && ([ -f chunks/master-audio/manifest.json ] && cp chunks/master-audio/manifest.json src/manifest.json || true) && ([ -f chunks/master-audio/lipsync.json ] && cp chunks/master-audio/lipsync.json src/lipsync.json || true)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/remotion
          key: remotion-v2-${{ hashFiles('package.json') }}
      - name: Install Tamil Fonts
        run: sudo apt-get update -qq || true; sudo apt-get install -y --no-install-recommends fonts-lohit-taml fonts-noto-core || sudo apt-get install -y --no-install-recommends fonts-lohit-taml || true
      - name: Install Node Dependencies
        run: "[ -d node_modules ] || npm install --legacy-peer-deps --no-audit --no-fund"
      - name: Ensure Remotion Browser
        run: npx remotion browser ensure
      - name: Render 30s Chunk ${{ matrix.id }} (3x Self-Heal)
        run: |
          mkdir -p out
          OUT="out/chunk_${{ matrix.id }}.mp4"
          for attempt in 1 2 3; do
            if npx remotion render src/index.ts MainMovie "$OUT" --frames=${{ matrix.range }} --muted --concurrency=2; then
              DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$OUT" || echo "0")
              if [ -n "$DUR" ] && awk "BEGIN {exit !($DUR > 0.5)}"; then exit 0; fi
            fi
            rm -f "$OUT"; sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.id }}
          path: out/chunk_*.mp4
          retention-days: 1

  render-reel:
    needs: [plan, voice-lane, manim-lane, blender-lane]
    if: ${{ !cancelled() && needs.plan.outputs.render_target != 'yt' && (needs.manim-lane.result == 'success' || needs.manim-lane.result == 'skipped') && (needs.blender-lane.result == 'success' || needs.blender-lane.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: master-audio
          path: chunks/master-audio
      - run: cp chunks/master-audio/words.json src/words.json && ([ -f chunks/master-audio/manifest.json ] && cp chunks/master-audio/manifest.json src/manifest.json || true) && ([ -f chunks/master-audio/lipsync.json ] && cp chunks/master-audio/lipsync.json src/lipsync.json || true)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/remotion
          key: remotion-v2-${{ hashFiles('package.json') }}
      - name: Install Tamil Fonts
        run: sudo apt-get update -qq || true; sudo apt-get install -y --no-install-recommends fonts-lohit-taml fonts-noto-core || sudo apt-get install -y --no-install-recommends fonts-lohit-taml || true
      - name: Install Node Dependencies
        run: "[ -d node_modules ] || npm install --legacy-peer-deps --no-audit --no-fund"
      - name: Ensure Remotion Browser
        run: npx remotion browser ensure
      - name: Render Reel 9x16
        run: |
          mkdir -p out
          npx remotion render src/index.ts Reel9x16 out/reel_9x16.mp4 --muted --concurrency=2
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-reel
          path: out/reel_9x16.mp4
          retention-days: 1

  merge-final:
    needs: [plan, voice-lane, render-chunks, render-reel]
    if: ${{ !cancelled() && needs.voice-lane.result == 'success' && (needs.render-chunks.result == 'success' || needs.render-chunks.result == 'skipped') && (needs.render-reel.result == 'success' || needs.render-reel.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: chunks
      - name: Quality Gate, Mux Audio & Build 480p Proxy
        run: |
          which ffmpeg >/dev/null 2>&1 || ((sudo apt-get update -qq || true) && sudo apt-get install -y --no-install-recommends ffmpeg)
          mkdir -p final
          ls chunks/chunk-0* >/dev/null 2>&1 && python3 scripts/verify_merge.py || true
          python3 scripts/cutaway_merge.py || true
          if [ -f chunks/chunk-reel/reel_9x16.mp4 ]; then VDUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 chunks/chunk-reel/reel_9x16.mp4); VDUR=${VDUR:-35}; ffmpeg -y -i chunks/chunk-reel/reel_9x16.mp4 -i chunks/master-audio/master_audio.mp3 -af "apad=whole_dur=${VDUR}" -t "${VDUR}" -c:v copy -c:a aac -b:a 192k final/reel_9x16.mp4; fi
          cp chunks/master-audio/captions.srt final/captions.srt || true
      - name: Verify G01-G15 Gates & Social Pack
        run: git fetch --tags -q && python3 -m pip install -q pyyaml && python3 scripts/qa_check.py && (if [ -f final/final_master.mp4 ]; then python3 scripts/verify_g0_g15.py; fi) && (python3 scripts/social_pack.py || true)
      - name: Generate A/B Thumbnails (Pre-Send)
        run: |
          sudo apt-get update -qq || true; sudo apt-get install -y --no-install-recommends fonts-lohit-taml fonts-noto-core || sudo apt-get install -y --no-install-recommends fonts-lohit-taml || true
          python3 scripts/generate_thumbnails.py || true
      - name: Send 480p Proxy to Telegram (if configured)
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$BOT" ] && [ -n "$CHAT" ] && [ -f final/preview_480p.mp4 ]; then
            ffmpeg -y -ss 00:00:01 -i final/preview_480p.mp4 -vframes 1 -vf "scale=320:-1" -q:v 3 final/preview_thumb.jpg 2>/dev/null || true
            PDUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 final/preview_480p.mp4 2>/dev/null | cut -d. -f1)
            PTHM=()
            [ -f final/preview_thumb.jpg ] && PTHM=(-F "thumbnail=@final/preview_thumb.jpg")
            curl -s -F "chat_id=$CHAT" -F "video=@final/preview_480p.mp4" -F "duration=${PDUR:-35}" -F "width=854" -F "height=480" -F "supports_streaming=true" "${PTHM[@]}" -F "caption=YUNA 480p Preview (16:9)" "https://api.telegram.org/bot${BOT}/sendVideo" > /dev/null || true
          fi
          for img in final/*.png; do [ -f "$img" ] && [ -n "$BOT" ] && [ -n "$CHAT" ] && curl -s -F "chat_id=$CHAT" -F "photo=@$img" "https://api.telegram.org/bot${BOT}/sendPhoto" > /dev/null || true; break; done
          if [ -n "$BOT" ] && [ -n "$CHAT" ] && [ -f final/reel_9x16.mp4 ]; then
            ffmpeg -y -ss 00:00:01 -i final/reel_9x16.mp4 -vframes 1 -vf "scale=320:-1" -q:v 3 final/reel_thumb.jpg 2>/dev/null || true
            RDUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 final/reel_9x16.mp4 2>/dev/null | cut -d. -f1)
            RTHM=()
            [ -f final/reel_thumb.jpg ] && RTHM=(-F "thumbnail=@final/reel_thumb.jpg")
            curl -s -F "chat_id=$CHAT" -F "video=@final/reel_9x16.mp4" -F "duration=${RDUR:-35}" -F "width=1080" -F "height=1920" -F "supports_streaming=true" "${RTHM[@]}" -F "caption=YUNA 9:16 Reel Ready" -F 'reply_markup={"inline_keyboard":[[{"text":"✅ Approve & Tag","callback_data":"approve"}]]}' "https://api.telegram.org/bot${BOT}/sendVideo" > /dev/null || true
            [ -f final/social_tg.txt ] && curl -s -F "chat_id=$CHAT" -F "text=<final/social_tg.txt" "https://api.telegram.org/bot${BOT}/sendMessage" > /dev/null || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pro-studio-delivery-pack
          path: final/*
          retention-days: 2

  notify-failure:
    needs: [plan, voice-lane, render-chunks, render-reel, merge-final]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Alert Telegram on Failure
        run: |
          curl -s "https://yuna-video-studio.masskannan719.workers.dev/api/tg/fail?run_id=${{ github.run_id }}&pin=yuna2026" > /dev/null || true
