name: Character Sheet Auto-Ingest
on:
  push:
    paths:
      - 'assets/raw_chars/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parse-chars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow & NumPy
        run: |
          pip install --quiet pillow numpy opencv-python-headless mediapipe vtracer
          mkdir -p models
          curl -sL -o models/pose_landmarker_heavy.task "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/latest/pose_landmarker_heavy.task" || true
          curl -sL -o models/face_landmarker.task "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task" || true
      - name: Parse Character Sheets & Update Manifest
        run: |
          python3 - << 'PYEOF'
          import glob, os, json, subprocess
          for p in sorted(glob.glob("assets/raw_chars/*_sheet.*")):
              cname = os.path.basename(p).split("_sheet.")[0]
              subprocess.run(["python3", "scripts/parse_char_sheet.py", p, cname], check=True)
          manifest = {}
          for r in sorted(glob.glob("public/approved/chars/*/char_rig.json")):
              cname = os.path.basename(os.path.dirname(r))
              with open(r, "r", encoding="utf-8") as f:
                  manifest[cname.lower()] = json.load(f)
          with open("src/rig/chars_manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          svgs_manifest = {}
          for sp in sorted(glob.glob("public/approved/chars/*/rig_svgs.json")):
              cname = os.path.basename(os.path.dirname(sp))
              with open(sp, "r", encoding="utf-8") as sf:
                  svgs_manifest[cname.lower()] = json.load(sf)
          with open("src/rig/chars_svgs_manifest.json", "w", encoding="utf-8") as sf:
              json.dump(svgs_manifest, sf)
          print("MANIFEST_UPDATED:", list(manifest.keys()))
          PYEOF
      - name: Commit Approved Character Rigs
        run: |
          git config user.name "yuna-bot"
          git config user.email "yuna-bot@users.noreply.github.com"
          git add public/approved/chars/ src/rig/chars_manifest.json src/rig/chars_svgs_manifest.json
          git diff --staged --quiet || (git commit -m "chore(chars): auto-parsed 4-angle + 6-face rig + manifest [skip ci]" && git push)
